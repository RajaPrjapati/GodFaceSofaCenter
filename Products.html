<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Auto Update Table Example</title>
  <style>
    table { width: 300px; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    input { width: 80%; padding: 4px; text-align: center; }
    .total-row { font-weight: bold; background-color: #f2f2f2; }
  </style>
</head>
<body>

  <h3>Auto Update Calculation</h3>

  <table>
    <tr>
      <th>Month</th>
      <th>Amount</th>
    </tr>
    <tr>
      <td>January</td>
      <td><input type="number" class="amount" value="1200"></td>
    </tr>
    <tr>
      <td>February</td>
      <td><input type="number" class="amount" value="500"></td>
    </tr>
    <tr class="total-row">
      <td>Total</td>
      <td id="grandTotal">0</td>
    </tr>
  </table>

  <script>
    function calculateTotal() {
      let total = 0;
      // Sabhi amount wale inputs ko select karein
      const inputs = document.querySelectorAll('.amount');
      inputs.forEach(input => {
        let val = parseFloat(input.value) || 0;
        total += val;
      });
      // Total ko update karein
      document.getElementById('grandTotal').innerText = total;
    }

    // Har input box par 'input' event listener lagayein
    document.querySelectorAll('.amount').forEach(input => {
      input.addEventListener('input', calculateTotal);
    });

    // Page load hote hi initial calculation run karein
    calculateTotal();
  </script>

</body>
</html>
