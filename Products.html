<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Interest Details Table</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
    }
    th {
      background-color: #d81b60;
      color: white;
    }

    /* Input Field Styling */
    input.amount {
      width: 50px;
      text-align: center;
      border: none;
      outline: none;
      background: transparent;
      font-size: 13px;
      font-family: inherit;
    }

    /* Arrows / Spinners ko hatane ke liye */
    input.amount::-webkit-outer-spin-button,
    input.amount::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input.amount[type=number] {
      -moz-appearance: textfield;
    }

    .total-cell {
      font-weight: bold;
    }
    .grand-total {
      background-color: #f8bbd0;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h3>💰 Interest Details</h3>

<table id="interestTable">
  <thead>
    <tr>
      <th>S.N</th>
      <th>Member Name</th>
      <th>10 Jan</th>
      <th>10 Feb</th>
      <th>10 Mar</th>
      <th>Name Wise Total</th>
    </tr>
  </thead>
  <tbody>
    <!-- Row 1 -->
    <tr class="data-row">
      <td>1</td>
      <td>Anuj Lodhi</td>
      <td><input type="number" class="amount col-0" value="500" min="0"></td>
      <td><input type="number" class="amount col-1" value="500" min="0"></td>
      <td><input type="number" class="amount col-2" value="500" min="0"></td>
      <td class="row-total total-cell">0</td>
    </tr>
    <!-- Row 2 -->
    <tr class="data-row">
      <td>2</td>
      <td>Raja Prajapati</td>
      <td><input type="number" class="amount col-0" value="0" min="0"></td>
      <td><input type="number" class="amount col-1" value="500" min="0"></td>
      <td><input type="number" class="amount col-2" value="500" min="0"></td>
      <td class="row-total total-cell">0</td>
    </tr>
  </tbody>
  <tfoot>
    <tr class="grand-total">
      <td colspan="2">Month Wise Total</td>
      <td id="col-total-0" class="col-total">0</td>
      <td id="col-total-1" class="col-total">0</td>
      <td id="col-total-2" class="col-total">0</td>
      <td id="finalGrandTotal">0</td>
    </tr>
  </tfoot>
</table>

<script>
  function calculateTotals() {
    const rows = document.querySelectorAll('.data-row');
    let overallTotal = 0;
    const colTotals = [0, 0, 0];

    rows.forEach(row => {
      let rowSum = 0;
      const inputs = row.querySelectorAll('.amount');
      
      inputs.forEach((input, colIndex) => {
        let val = parseFloat(input.value) || 0;
        rowSum += val;
        
        if (colTotals[colIndex] !== undefined) {
          colTotals[colIndex] += val;
        }
      });

      row.querySelector('.row-total').innerText = rowSum;
      overallTotal += rowSum;
    });

    colTotals.forEach((colSum, index) => {
      const colEl = document.getElementById(`col-total-${index}`);
      if (colEl) {
        colEl.innerText = colSum;
      }
    });

    document.getElementById('finalGrandTotal').innerText = overallTotal;
  }

  document.querySelectorAll('.amount').forEach(input => {
    // 1. Backspace aur Delete Key ko completely block karne ke liye
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' || e.key === 'Delete') {
        // Agar poori value delete hone wali ho toh Backspace kaam nahi karega
        if (this.value.length <= 1) {
          e.preventDefault();
          this.value = '0';
          calculateTotals();
        }
      }
    });

    // 2. Typing aur instant total update
    input.addEventListener('input', function() {
      // Agar value empty ho jaye ya negative ho jaye toh turant 0 kar do
      if (this.value === '' || this.value < 0) {
        this.value = 0;
      }
      // Agar leading zeros aa jayein (jaise 0500), toh use clean karne ke liye:
      if (this.value.length > 1 && this.value.startsWith('0')) {
        this.value = parseFloat(this.value);
      }
      calculateTotals();
    });

    // 3. Focus lose hone par bhi safe zero fallback
    input.addEventListener('blur', function() {
      if (this.value === '' || isNaN(this.value)) {
        this.value = 0;
        calculateTotals();
      }
    });
  });

  calculateTotals();
</script>

</body>
</html>
